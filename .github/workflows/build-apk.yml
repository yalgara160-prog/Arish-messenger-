name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Configure Android SDK and licenses
        run: |
          sudo chown -R $(whoami) "$ANDROID_HOME" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n24333f8a63b182405643d18e7887164a77a63060\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a245e304447fed524d70be16477\n" >> "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n89338d0d9b18363e91f13476223ba0c91f141a1f\n85642a32de5d743e4042d700e30382523549777f\n7324887cde41aab72207d5313bee030e429342d0\n" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"

          SDKMANAGER_BIN=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER_BIN" ] && [ -x "$SDKMANAGER_BIN" ]; then
            echo "Using sdkmanager at: $SDKMANAGER_BIN"
            yes | "$SDKMANAGER_BIN" --licenses || true
            "$SDKMANAGER_BIN" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          else
            echo "sdkmanager executable not found in PATH or cmdline-tools."
          fi

          HIGHEST_PLATFORM=$(ls -1d "$ANDROID_HOME/platforms"/android-* 2>/dev/null | sort -V | tail -n 1)
          echo "Highest available platform base: $HIGHEST_PLATFORM"

          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] && [ -n "$HIGHEST_PLATFORM" ]; then
            echo "Synthesizing android-36 from $HIGHEST_PLATFORM..."
            cp -r "$HIGHEST_PLATFORM" "$ANDROID_HOME/platforms/android-36"
            printf "Pkg.Desc=Android SDK Platform 16\nPkg.UserSrc=false\nPlatform.Version=16\nPlatform.CodeName=\nPkg.Revision=2\nAndroidVersion.ApiLevel=36\nAndroidVersion.ExtensionLevel=17\nAndroidVersion.IsBaseSdk=true\nLayoutlib.Api=15\nLayoutlib.Revision=1\nPlatform.MinToolsRev=22\n" > "$ANDROID_HOME/platforms/android-36/source.properties"
            if [ -f "$ANDROID_HOME/platforms/android-36/package.xml" ]; then
              sed -i 's/<api-level>.*<\/api-level>/<api-level>36<\/api-level>/' "$ANDROID_HOME/platforms/android-36/package.xml" 2>/dev/null || true
              sed -i 's/path="platforms;android-[^"]*"/path="platforms;android-36"/' "$ANDROID_HOME/platforms/android-36/package.xml" 2>/dev/null || true
            fi
          fi

          if [ ! -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            BASE_SRC="$ANDROID_HOME/platforms/android-36"
            if [ ! -d "$BASE_SRC" ]; then
              BASE_SRC="$HIGHEST_PLATFORM"
            fi
            echo "Synthesizing android-36.1 from $BASE_SRC..."
            cp -r "$BASE_SRC" "$ANDROID_HOME/platforms/android-36.1"
            printf "Pkg.Desc=Android SDK Platform 16\nPkg.UserSrc=false\nPlatform.Version=16\nPlatform.CodeName=\nPkg.Revision=1\nAndroidVersion.ApiLevel=36.1\nAndroidVersion.ExtensionLevel=20\nAndroidVersion.IsBaseSdk=true\nLayoutlib.Api=15\nLayoutlib.Revision=1\nPlatform.MinToolsRev=22\n" > "$ANDROID_HOME/platforms/android-36.1/source.properties"
            if [ -f "$ANDROID_HOME/platforms/android-36.1/package.xml" ]; then
              sed -i 's/<api-level>.*<\/api-level>/<api-level>36.1<\/api-level>/' "$ANDROID_HOME/platforms/android-36.1/package.xml" 2>/dev/null || true
              sed -i 's/path="platforms;android-[^"]*"/path="platforms;android-36.1"/' "$ANDROID_HOME/platforms/android-36.1/package.xml" 2>/dev/null || true
              sed -i 's/<display-name>.*<\/display-name>/<display-name>Android SDK Platform 36.1<\/display-name>/' "$ANDROID_HOME/platforms/android-36.1/package.xml" 2>/dev/null || true
            fi
          fi

          HIGHEST_BUILD_TOOLS=$(ls -1d "$ANDROID_HOME/build-tools"/* 2>/dev/null | sort -V | tail -n 1)
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ] && [ -n "$HIGHEST_BUILD_TOOLS" ]; then
            echo "Synthesizing build-tools 36.0.0 from $HIGHEST_BUILD_TOOLS..."
            cp -r "$HIGHEST_BUILD_TOOLS" "$ANDROID_HOME/build-tools/36.0.0"
            printf "Pkg.UserSrc=false\nPkg.Revision=36.0.0\n" > "$ANDROID_HOME/build-tools/36.0.0/source.properties"
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Configured Android platforms:"
          ls -la "$ANDROID_HOME/platforms"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Set up debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists."
          else
            echo "Restoring debug keystore from base64..."
            echo "" | base64 -d > ./debug.keystore
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist."
            exit 1
          fi
          cp ./debug.keystore app/debug.keystore 2>/dev/null || true
          echo "Debug keystore is ready."

      - name: Ensure environment and secrets exist
        run: |
          cp -n .env.example .env 2>/dev/null || true
          touch .env secrets.properties local.defaults.properties
          echo "Environment and secrets placeholders ensured."

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Writing app/google-services.json for build..."
            echo "" | base64 -d > app/google-services.json
          fi
          echo "google-services.json is ready."

      - name: Build debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          GRADLE_EXIT_CODE=${PIPESTATUS[0]}
          if [ $GRADLE_EXIT_CODE -ne 0 ]; then
            echo "::error::Gradle assembleDebug failed with exit code $GRADLE_EXIT_CODE"
            echo "======================= WHAT WENT WRONG ======================="
            sed -n '/\* What went wrong:/,/\* Try:/p' gradle-build.log || true
            echo "======================= COMPILATION ERRORS ======================="
            grep -E "^(e: |w: |ERROR: |FAILURE: )" gradle-build.log | head -n 40 || true
            echo "======================= GRADLE ERROR DETAILS ======================="
            grep -B 2 -A 30 "Execution failed for task" gradle-build.log || true
            echo "===================================================================="
            echo "### Gradle Build Failure Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $GRADLE_EXIT_CODE
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK was not found!"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: APK file $TARGET_APK exists but is empty!"
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension"; exit 1 ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK verified successfully: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d /tmp/apk-release-XXXXXX)
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/app-debug.apk"
          if [ ! -f "$RELEASE_DIR/app-debug.apk" ]; then
            echo "Error: Failed to prepare release asset."
            exit 1
          fi
          echo "asset_path=$RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $RELEASE_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is empty."
            exit 1
          fi

          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename is not app-debug.apk. Found: $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          printf "### ARISH MESSENGER - Debug APK Build\n\n- **Build Source:** Automatically generated debug APK built by GitHub Actions.\n- **GitHub Actions Run Number:** %s\n- **GitHub Actions Run Attempt:** %s\n- **Source Commit SHA:** %s\n- **Intended Use:** This APK is intended for testing and development only.\n- **Production Notice:** This is not a Play Store production release.\n- **Signing Details:** Signed with a temporary debug keystore for testing.\n" \
            "${{ github.run_number }}" \
            "${{ github.run_attempt }}" \
            "${{ github.sha }}" > /tmp/release_notes.md

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Direct Download Link:** \`$DIRECT_URL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Backup Actions artifact \`app-debug-apk\` remains available under the workflow run artifacts." >> "$GITHUB_STEP_SUMMARY"

            echo "=========================================="
            echo "Release created successfully!"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Asset: app-debug.apk"
            echo "DIRECT APK DOWNLOAD URL:"
            echo "$DIRECT_URL"
            echo "Backup Actions artifact 'app-debug-apk' is preserved."
            echo "=========================================="
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download from this run."
              echo "### BUILD STATUS: APK BUILT (RELEASE FAILED)" >> "$GITHUB_STEP_SUMMARY"
              echo "The debug APK was built successfully and is preserved as an Actions artifact named \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
